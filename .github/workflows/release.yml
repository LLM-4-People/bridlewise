name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix engine ci --no-audit --no-fund

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Verify the tree
        run: |
          npm run typecheck
          npm --prefix engine run typecheck
          npm run check:secrets
          npm run build
          npm --prefix engine run build:bundle
          make -C engine/guardian all
          make -C engine/guardian test

      - name: Package source and build output
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="bridlewise-${TAG}/" HEAD -o "release/bridlewise-${TAG}-source.tar.gz"
          tar -C dist -czf "release/bridlewise-${TAG}-cockpit.tar.gz" client
          cp engine/dist/bundle.js "release/bridlewise-${TAG}-engine-bundle.js"
          (cd release && sha256sum ./* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Bridlewise $TAG (developer preview)" \
            --generate-notes \
            --verify-tag \
            release/*
