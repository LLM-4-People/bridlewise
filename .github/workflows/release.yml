name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix engine ci --no-audit --no-fund

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Verify the tree
        run: |
          npm run typecheck
          npm --prefix engine run typecheck
          npm run check:secrets
          npm run build
          npm --prefix engine run build:bundle
          make -C engine/guardian all
          make -C engine/guardian test

      - name: Package source and build output
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="bridlewise-${TAG}/" HEAD -o "release/bridlewise-${TAG}-source.tar.gz"
          tar -C dist -czf "release/bridlewise-${TAG}-cockpit.tar.gz" client
          cp engine/dist/bundle.js "release/bridlewise-${TAG}-engine-bundle.js"
          npm sbom --sbom-format=spdx --omit=dev --package-lock-only > "release/bridlewise-${TAG}-sbom-web.spdx.json"
          (cd engine && npm sbom --sbom-format=spdx --omit=dev --package-lock-only) > "release/bridlewise-${TAG}-sbom-engine.spdx.json"
          (cd release && sha256sum ./* > SHA256SUMS)

      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.js
            release/*.spdx.json
            release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Bridlewise $TAG (developer preview)" \
            --prerelease \
            --notes "**Developer preview. Not production-ready. Do not use Bridlewise with sensitive, proprietary, regulated, or production codebases.** Every release is a preview: the source, cockpit build, and engine bundle are attached for inspection, not for deployment. Read the repository warning and SECURITY.md before running anything." \
            --generate-notes \
            --verify-tag \
            release/*
