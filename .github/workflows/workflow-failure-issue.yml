name: Report workflow failure

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Docs links
      - Secret scan
      - Docs site
      - Dependency review
      - Release
      - Promotion check
      - OpenSSF Scorecard
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    permissions:
      contents: read
      issues: write
      actions: read
    uses: LLM-4-People/bridlewise-testing/.github/workflows/reusable-workflow-failure.yml@a9fbfb6e945b0ccfef0c5ffea7f4ef49f338ae48
