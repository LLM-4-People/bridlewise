name: Docs links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Relative Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0

      - name: Check relative links
        run: node scripts/check-docs-links.mjs

      # The shared records are PROJECTED from the development floor; a hand
      # edit in this tree drifts silently. The floor is public, so the check
      # reads it rather than trusting a copy.
      - name: Check out the development floor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LLM-4-People/bridlewise-testing
          path: .floor

      - name: Check the shared records match the floor
        run: node scripts/sync-docs.mjs --floor .floor --check
