name: Promotion check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Product commit to verify, default is the selected branch head
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Run the floor promotion gate
    permissions:
      contents: read
      actions: read
      security-events: read
      vulnerability-alerts: read
    uses: LLM-4-People/bridlewise-testing/.github/workflows/promotion-gate.yml@a9fbfb6e945b0ccfef0c5ffea7f4ef49f338ae48
    with:
      product_repo: ${{ github.repository }}
      product_sha: ${{ inputs.sha || github.sha }}
      product_tag: dry-run
      testing_sha: a9fbfb6e945b0ccfef0c5ffea7f4ef49f338ae48
