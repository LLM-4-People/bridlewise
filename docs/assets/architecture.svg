<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Bridlewise architecture</title>
  <desc id="arch-desc">The cockpit talks to a loopback server over HTTP and SSE. The server owns SQLite storage, run execution, and the tool executor. The engine owns agents, tools, intelligence, and memory, and reaches the project through the Landlock guardian. The engine calls the configured model provider. Database keys live in a key home outside the checkout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fd3ff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79818d"/>
    </marker>
    <style>
      .ground { fill: #101216; }
      .box { fill: #1b1f25; stroke: #39404b; stroke-width: 1; }
      .box-accent { fill: #1b1f25; stroke: #8fd3ff; stroke-width: 1; }
      .label { fill: #e8ebef; font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
      .note { fill: #a6adb8; font-family: ui-sans-serif, "DejaVu Sans", sans-serif; font-size: 12px; }
      .micro { fill: #79818d; font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10px; letter-spacing: 0.08em; }
      .beam { fill: #8fd3ff; }
      .edge { stroke: #8fd3ff; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .edge-muted { stroke: #79818d; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-muted); }
      .rule { stroke: #262b33; stroke-width: 1; }
    </style>
  </defs>

  <rect class="ground" x="0" y="0" width="840" height="620"/>
  <text class="micro" x="28" y="30">BRIDLEWISE / SYSTEM SHAPE</text>
  <text class="micro" x="690" y="30">LOCAL MACHINE</text>
  <line class="rule" x1="28" y1="44" x2="812" y2="44"/>

  <!-- Browser -->
  <rect class="box" x="28" y="66" width="300" height="74" rx="4"/>
  <text class="label" x="44" y="92">BROWSER / COCKPIT</text>
  <text class="note" x="44" y="112">Svelte 5 · FLOW · SWEEP · DESK</text>
  <text class="micro" x="44" y="128">127.0.0.1:5173</text>

  <!-- Server -->
  <rect class="box-accent" x="28" y="190" width="330" height="102" rx="4"/>
  <text class="label" x="44" y="216">LOOPBACK SERVER</text>
  <text class="note" x="44" y="236">router · auth · sessions · runs</text>
  <text class="note" x="44" y="253">tool executor · redaction · SSE</text>
  <text class="micro" x="44" y="274">127.0.0.1:5174</text>

  <!-- DB -->
  <rect class="box" x="478" y="176" width="222" height="86" rx="4"/>
  <text class="label" x="494" y="202">SQLITE</text>
  <text class="note" x="494" y="222">web.db · timeline.db</text>
  <text class="note" x="494" y="239">sensitive fields encrypted</text>

  <!-- Key home -->
  <rect class="box" x="478" y="292" width="222" height="72" rx="4"/>
  <text class="label" x="494" y="318">KEY HOME</text>
  <text class="note" x="494" y="338">outside every checkout</text>
  <text class="micro" x="494" y="354">MODE 0700</text>

  <!-- Engine -->
  <rect class="box" x="28" y="348" width="330" height="98" rx="4"/>
  <text class="label" x="44" y="374">ENGINE</text>
  <text class="note" x="44" y="394">agents · tools · editor · memory</text>
  <text class="note" x="44" y="411">intelligence · quality · timeline</text>
  <text class="micro" x="44" y="432">PRE-ADMISSION</text>

  <!-- Provider -->
  <rect class="box" x="478" y="392" width="222" height="74" rx="4"/>
  <text class="label" x="494" y="418">MODEL PROVIDER</text>
  <text class="note" x="494" y="438">the endpoint you configure</text>
  <text class="micro" x="494" y="454">OPENAI-STYLE PROTOCOLS</text>

  <!-- Guardian -->
  <rect class="box" x="28" y="494" width="330" height="74" rx="4"/>
  <text class="label" x="44" y="520">GUARDIAN</text>
  <text class="note" x="44" y="540">Landlock · Linux · fails closed</text>
  <text class="micro" x="44" y="556">FILESYSTEM CONFINEMENT</text>

  <!-- Project -->
  <rect class="box" x="478" y="494" width="222" height="74" rx="4"/>
  <text class="label" x="494" y="520">PROJECT</text>
  <text class="note" x="494" y="540">the selected directory</text>
  <text class="micro" x="494" y="556">DISPOSABLE COPY</text>

  <!-- Edges -->
  <path class="edge" d="M 178 140 L 178 184"/>
  <text class="micro" x="190" y="166">HTTP + SSE</text>

  <path class="edge" d="M 358 224 L 472 214"/>
  <path class="edge" d="M 358 258 L 472 286"/>
  <text class="micro" x="374" y="248">READ / WRITE</text>

  <path class="edge-muted" d="M 700 262 L 700 288"/>
  <text class="micro" x="710" y="280">KEY</text>

  <path class="edge" d="M 193 292 L 193 342"/>
  <path class="edge" d="M 193 446 L 193 488"/>
  <path class="edge" d="M 358 520 L 472 520"/>
  <path class="edge" d="M 358 396 L 472 414"/>
  <text class="micro" x="366" y="399">MODEL CALLS</text>

  <!-- Footnote -->
  <text class="micro" x="28" y="600">DEVELOPER PREVIEW · NOT A SECURITY BOUNDARY CLAIM · READ /SECURITY/</text>
</svg>
